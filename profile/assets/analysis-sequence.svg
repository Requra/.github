<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Requra async analysis lifecycle</title>
<defs>
  <linearGradient id="seq-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F0FF"/><stop offset="1" stop-color="#F2EEFF"/></linearGradient>
  <marker id="seq-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CE6"/></marker>
  <marker id="seq-dash-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9CA3AF"/></marker>
</defs>
<rect width="1200" height="800" fill="url(#seq-bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <line x1="140" y1="100" x2="140" y2="720" stroke="#E5DEFF" stroke-width="2"/>
  <text x="140" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#4B3E80">Frontend</text>
  <line x1="300" y1="100" x2="300" y2="720" stroke="#E5DEFF" stroke-width="2"/>
  <text x="300" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#4B3E80">Backend</text>
  <line x1="460" y1="100" x2="460" y2="720" stroke="#E5DEFF" stroke-width="2"/>
  <text x="460" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#4B3E80">FastAPI</text>
  <line x1="620" y1="100" x2="620" y2="720" stroke="#E5DEFF" stroke-width="2"/>
  <text x="620" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#4B3E80">Durable</text>
  <line x1="800" y1="100" x2="800" y2="720" stroke="#E5DEFF" stroke-width="2"/>
  <text x="800" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#4B3E80">Redis/RQ</text>
  <line x1="970" y1="100" x2="970" y2="720" stroke="#E5DEFF" stroke-width="2"/>
  <text x="970" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#4B3E80">Worker</text>
  <path d="M140 140L300 140" stroke="#7C5CE6" stroke-width="2.5" marker-end="url(#seq-arr)"/>
  <text x="220" y="130" text-anchor="middle" font-size="13" fill="#4B3E80" font-weight="600">1. POST upload</text>
  <path d="M300 180L460 180" stroke="#7C5CE6" stroke-width="2.5" marker-end="url(#seq-arr)"/>
  <text x="380" y="170" text-anchor="middle" font-size="13" fill="#4B3E80" font-weight="600">2. Process file</text>
  <path d="M460 220L620 220" stroke="#7C5CE6" stroke-width="2.5" marker-end="url(#seq-arr)"/>
  <text x="540" y="210" text-anchor="middle" font-size="13" fill="#4B3E80" font-weight="600">3. Store state</text>
  <path d="M620 260L800 260" stroke="#7C5CE6" stroke-width="2.5" marker-end="url(#seq-arr)"/>
  <text x="710" y="250" text-anchor="middle" font-size="13" fill="#4B3E80" font-weight="600">4. Enqueue</text>
  <path d="M800 300L970 300" stroke="#7C5CE6" stroke-width="2.5" marker-end="url(#seq-arr)"/>
  <text x="885" y="290" text-anchor="middle" font-size="13" fill="#4B3E80" font-weight="600">5. Pick task</text>
  <rect x="900" y="330" width="160" height="60" rx="12" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="980" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#0369A1">Processing</text>
  <text x="980" y="370" text-anchor="middle" font-size="12" fill="#0369A1">15-node pipeline</text>
  <path d="M970 410L800 440" stroke="#7C5CE6" stroke-width="2.5" marker-end="url(#seq-arr)"/>
  <text x="885" y="430" text-anchor="middle" font-size="13" fill="#4B3E80" font-weight="600">6. Store result</text>
  <rect x="60" y="500" width="320" height="80" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.5"/>
  <text x="220" y="525" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">Authoritative polling</text>
  <text x="220" y="548" text-anchor="middle" font-size="12" fill="#22C55E">Frontend: GET /status/:id</text>
  <text x="220" y="567" text-anchor="middle" font-size="12" fill="#22C55E">Reads verified DB state</text>
  <path d="M140 450Q140 560 620 560" stroke="#22C55E" stroke-width="3" marker-end="url(#seq-arr)" stroke-dasharray="3,2"/>
  <text x="350" y="445" text-anchor="middle" font-size="12" fill="#22C55E" font-weight="600">7-10. Poll ×N</text>
  <rect x="700" y="640" width="320" height="80" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="860" y="665" text-anchor="middle" font-size="14" font-weight="600" fill="#4B5563">(Optional) Callback</text>
  <text x="860" y="688" text-anchor="middle" font-size="12" fill="#6B7280">Worker → Webhook</text>
  <text x="860" y="707" text-anchor="middle" font-size="12" fill="#6B7280">Not required</text>
</g>
</svg>
