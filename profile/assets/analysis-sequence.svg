<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Requra.AI asynchronous analysis sequence</title>
<desc id="desc">The frontend asks the backend to start analysis. The backend submits an internal job. FastAPI validates and fingerprints the request, persists it, queues work, and returns a durable job identity. A worker recovers inputs, runs the AI graph, and persists artifacts. Polling is authoritative; callbacks are optional.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6D3ED1"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8A92A3"/></marker></defs>
<rect width="1200" height="740" rx="28" fill="#FBFAFE"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="50" y="54" fill="#25183C" font-size="28" font-weight="800">Asynchronous analysis lifecycle</text>
<text x="50" y="82" fill="#6F647C" font-size="16">Polling is authoritative. Callback delivery is optional and best effort.</text>
<g transform="translate(35 112)"><rect width="170" height="58" rx="15" fill="#F0EBFD" stroke="#8B6AE3" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#3B246D" font-size="16" font-weight="800">Frontend</text></g>
<g transform="translate(225 112)"><rect width="170" height="58" rx="15" fill="#EEF3FA" stroke="#6F91B5" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#284A6F" font-size="16" font-weight="800">Backend</text></g>
<g transform="translate(415 112)"><rect width="170" height="58" rx="15" fill="#F0EBFD" stroke="#8B6AE3" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#3B246D" font-size="16" font-weight="800">FastAPI</text></g>
<g transform="translate(605 112)"><rect width="170" height="58" rx="15" fill="#FFFFFF" stroke="#A994DF" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#43316A" font-size="16" font-weight="800">Durable store</text></g>
<g transform="translate(795 112)"><rect width="170" height="58" rx="15" fill="#FFFFFF" stroke="#A994DF" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#43316A" font-size="16" font-weight="800">Redis / RQ</text></g>
<g transform="translate(985 112)"><rect width="170" height="58" rx="15" fill="#6D3ED1" stroke="#6D3ED1" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">Worker</text></g>
<line x1="120" y1="170" x2="120" y2="695" stroke="#D8D2E2" stroke-width="2" stroke-dasharray="6 7"/><line x1="310" y1="170" x2="310" y2="695" stroke="#D8D2E2" stroke-width="2" stroke-dasharray="6 7"/><line x1="500" y1="170" x2="500" y2="695" stroke="#D8D2E2" stroke-width="2" stroke-dasharray="6 7"/><line x1="690" y1="170" x2="690" y2="695" stroke="#D8D2E2" stroke-width="2" stroke-dasharray="6 7"/><line x1="880" y1="170" x2="880" y2="695" stroke="#D8D2E2" stroke-width="2" stroke-dasharray="6 7"/><line x1="1070" y1="170" x2="1070" y2="695" stroke="#D8D2E2" stroke-width="2" stroke-dasharray="6 7"/>
<path d="M120 210H300" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="210" y="201" text-anchor="middle" fill="#443652" font-size="14">1 · start analysis</text>
<path d="M310 255H490" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="246" text-anchor="middle" fill="#443652" font-size="14">2 · POST /internal/jobs</text>
<path d="M500 300H680" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="590" y="291" text-anchor="middle" fill="#443652" font-size="14">3 · validate + fingerprint + persist</text>
<path d="M500 345H870" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="685" y="336" text-anchor="middle" fill="#443652" font-size="14">4 · queue work / cache transient input</text>
<path d="M490 390H310" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="381" text-anchor="middle" fill="#443652" font-size="14">5 · 202 QUEUED or idempotent/conflict</text>
<path d="M880 435H1060" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="970" y="426" text-anchor="middle" fill="#443652" font-size="14">6 · execute attempt</text>
<rect x="920" y="455" width="260" height="112" rx="18" fill="#F0EBFD" stroke="#8B6AE3" stroke-width="2"/><text x="1050" y="482" text-anchor="middle" fill="#3B246D" font-size="15" font-weight="800">7 · recover source + run graph</text><text x="1050" y="508" text-anchor="middle" fill="#665A76" font-size="14">chunks · retrieval · grounding</text><text x="1050" y="532" text-anchor="middle" fill="#665A76" font-size="14">stories · quality · summary</text>
<path d="M1060 590H700" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="880" y="581" text-anchor="middle" fill="#443652" font-size="14">8 · persist artifacts + terminal result</text>
<path d="M310 630H680" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="495" y="621" text-anchor="middle" fill="#443652" font-size="14">9 · poll status / result</text>
<path d="M680 665H320" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="656" text-anchor="middle" fill="#443652" font-size="14">10 · durable status + normalized result</text>
<path d="M1060 610C990 610 955 610 935 610C770 610 520 560 320 520" fill="none" stroke="#8A92A3" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#g)"/><text x="680" y="538" fill="#6F7785" font-size="14">optional backend callback after result persistence</text>
<g transform="translate(48 690)"><rect width="515" height="34" rx="12" fill="#EAF7F2" stroke="#5FA98D"/><text x="257" y="22" text-anchor="middle" fill="#236A53" font-size="14" font-weight="750">Authoritative path: backend polling reads durable job and result state</text></g>
<g transform="translate(585 690)"><rect width="565" height="34" rx="12" fill="#F7F7F9" stroke="#A2A7B0" stroke-dasharray="7 6"/><text x="282" y="22" text-anchor="middle" fill="#606773" font-size="14" font-weight="750">Optional path: callback failure does not invalidate a persisted result</text></g>
</g></svg>