<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Requra.AI source-to-story traceability chain</title>
<desc id="desc">Source documents and meetings are split into page, speaker, or timestamp-aware chunks. Retrieved quotes are separately grounded, then attached to requirements, classification, user stories, acceptance criteria, and final coverage mappings.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6D3ED1"/></marker></defs>
<rect width="1200" height="470" rx="28" fill="#FBFAFE"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="48" y="55" fill="#25183C" font-size="28" font-weight="800">Traceability from source to delivery</text>
<text x="48" y="83" fill="#6F647C" font-size="16">Retrieval improves recall; grounding verifies that the final quote exists in the source.</text>
<g transform="translate(40 124)">
<g><rect width="220" height="92" rx="18" fill="#F0EBFD" stroke="#8B6AE3" stroke-width="2"/><text x="110" y="35" text-anchor="middle" fill="#3B246D" font-size="16" font-weight="800">Source</text><text x="110" y="61" text-anchor="middle" fill="#6D6479" font-size="14">document · meeting</text></g>
<g transform="translate(260)"><rect width="220" height="92" rx="18" fill="#FFFFFF" stroke="#A994DF" stroke-width="2"/><text x="110" y="35" text-anchor="middle" fill="#43316A" font-size="16" font-weight="800">Provenance-aware chunk</text><text x="110" y="61" text-anchor="middle" fill="#6D6479" font-size="14">page · speaker · timestamp</text></g>
<g transform="translate(520)"><rect width="220" height="92" rx="18" fill="#EAF7F2" stroke="#5FA98D" stroke-width="2"/><text x="110" y="35" text-anchor="middle" fill="#236A53" font-size="16" font-weight="800">Grounded evidence</text><text x="110" y="61" text-anchor="middle" fill="#6D6479" font-size="14">verified verbatim quote</text></g>
<g transform="translate(780)"><rect width="170" height="92" rx="18" fill="#F0EBFD" stroke="#8B6AE3" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#3B246D" font-size="16" font-weight="800">Requirement</text><text x="85" y="61" text-anchor="middle" fill="#6D6479" font-size="14">type · confidence</text></g>
<g transform="translate(990)"><rect width="170" height="92" rx="18" fill="#F0EBFD" stroke="#8B6AE3" stroke-width="2"/><text x="85" y="35" text-anchor="middle" fill="#3B246D" font-size="16" font-weight="800">User story</text><text x="85" y="61" text-anchor="middle" fill="#6D6479" font-size="14">coverage mapping</text></g>
<g transform="translate(160 170)"><rect width="220" height="92" rx="18" fill="#FFFFFF" stroke="#A994DF" stroke-width="2"/><text x="110" y="35" text-anchor="middle" fill="#43316A" font-size="16" font-weight="800">Acceptance criteria</text><text x="110" y="61" text-anchor="middle" fill="#6D6479" font-size="14">testable conditions</text></g>
<g transform="translate(480 170)"><rect width="240" height="92" rx="18" fill="#EEF3FA" stroke="#6F91B5" stroke-width="2"/><text x="120" y="35" text-anchor="middle" fill="#284A6F" font-size="16" font-weight="800">Final source reference</text><text x="120" y="61" text-anchor="middle" fill="#6D6479" font-size="14">document + chunk + quote</text></g>
<g transform="translate(820 170)"><rect width="260" height="92" rx="18" fill="#EAF7F2" stroke="#5FA98D" stroke-width="2"/><text x="130" y="35" text-anchor="middle" fill="#236A53" font-size="16" font-weight="800">Quality &amp; coverage</text><text x="130" y="61" text-anchor="middle" fill="#6D6479" font-size="14">groundedness · completeness</text></g>
<path d="M220 46H250" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M480 46H510" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 46H770" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M950 46H980" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M1075 92V145C1075 160 270 160 270 170" fill="none" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M380 216H470" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M720 216H810" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/>
</g>
<g transform="translate(48 414)"><circle cx="8" cy="8" r="8" fill="#5FA98D"/><text x="28" y="13" fill="#5F566A" font-size="14">Each final story can preserve the requirement and source evidence that justify it.</text></g>
</g></svg>