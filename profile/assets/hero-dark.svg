<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Requra.AI evidence-grounded requirements engineering</title>
<desc id="desc">Requra.AI transforms documents, meeting audio, notes, and transcripts into evidence-grounded requirements, user stories, acceptance criteria, summaries, and exports.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F0B18"/><stop offset="1" stop-color="#171126"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D3ED1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D3ED1"/><stop offset="1" stop-color="#9A6BFF"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9A7BF2"/></marker>
  <style>
    .flow{stroke-dasharray:9 9;animation:flow 8s linear infinite}
    .glow{animation:glow 3.4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-72}}
    @keyframes glow{0%,100%{opacity:.18}50%{opacity:.42}}
    @media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}}
  </style>
</defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="504" rx="24" fill="#151020" stroke="#3D3154" stroke-width="2"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <!-- Official Requra robot mark extracted from the product design. -->
  <rect x="70" y="56" width="78" height="68" rx="20" fill="#2A2038" stroke="#514268"/>
  <image x="81" y="67" width="56" height="47" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="166" y="88" fill="#F5F1FF" font-size="43" font-weight="800">Requra.AI</text>
  <text x="167" y="116" fill="#7C5CE6" font-size="14" font-weight="750" letter-spacing="1.7">REQUIREMENTS INTELLIGENCE</text>

  <text x="70" y="184" fill="#F5F1FF" font-size="38" font-weight="800">From scattered project context</text>
  <text x="70" y="228" fill="#F5F1FF" font-size="38" font-weight="800">to traceable, review-ready delivery.</text>
  <text x="70" y="274" fill="#B9AFC8" font-size="18">Capture the source. Retrieve the evidence. Verify every quote.</text>
  <text x="70" y="302" fill="#B9AFC8" font-size="18">Align stakeholders around requirements that stay connected to their origin.</text>

  <!-- Decorative traceability constellation; isolated from content bounds. -->
  <g opacity=".72">
    <path d="M964 88L1028 64L1098 104L1048 154L972 142Z" fill="none" stroke="#514268" stroke-width="2"/>
    <circle cx="964" cy="88" r="6" fill="#7C5CE6"/><circle cx="1028" cy="64" r="5" fill="#B89BFA"/><circle cx="1098" cy="104" r="7" fill="#7C5CE6"/><circle cx="1048" cy="154" r="5" fill="#55C7A4"/><circle cx="972" cy="142" r="4" fill="#78A9DB"/>
  </g>

  <!-- Input card -->
  <rect x="70" y="360" width="296" height="148" rx="22" fill="#3F236F" opacity=".07"/>
  <rect x="70" y="356" width="296" height="148" rx="22" fill="#21192E" stroke="#514268" stroke-width="1.5"/>
  <circle cx="104" cy="390" r="18" fill="#302243"/>
  <path d="M96 380h13l6 6v14H96zM109 380v7h6" fill="none" stroke="#D8C9FF" stroke-width="2" stroke-linejoin="round"/>
  <text x="134" y="386" fill="#F5F1FF" font-size="19" font-weight="750">Scattered context</text>
  <text x="134" y="410" fill="#B9AFC8" font-size="14.5">Documents · notes · transcripts</text>
  <text x="94" y="444" fill="#B9AFC8" font-size="14.5">Meeting audio · stakeholder input</text>
  <g font-size="12.5" font-weight="700">
    <rect x="94" y="463" width="72" height="25" rx="9" fill="#302243"/><text x="130" y="480" text-anchor="middle" fill="#D8C9FF">PDF/DOCX</text>
    <rect x="174" y="463" width="60" height="25" rx="9" fill="#183A32"/><text x="204" y="480" text-anchor="middle" fill="#9DE7D2">Audio</text>
    <rect x="242" y="463" width="70" height="25" rx="9" fill="#1E2E43"/><text x="277" y="480" text-anchor="middle" fill="#AFCDEF">Meetings</text>
  </g>

  <!-- Safe animated connector: only stroke offset changes, never group position. -->
  <path class="flow" d="M382 430H438" fill="none" stroke="#9A7BF2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Grounding core -->
  <circle class="glow" cx="600" cy="428" r="100" fill="#8B5CF6" opacity=".18"/>
  <rect x="452" y="342" width="296" height="184" rx="28" fill="#3F236F" opacity=".10"/>
  <rect x="452" y="338" width="296" height="184" rx="28" fill="url(#core)"/>
  <circle cx="486" cy="374" r="18" fill="#FFFFFF" fill-opacity=".16" stroke="#E9E2FF" stroke-opacity=".75"/>
  <path d="M477 375l6 6 12-14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="372" fill="#FFFFFF" font-size="17" font-weight="800">Evidence-grounded AI</text>
  <text x="476" y="410" fill="#F3EEFF" font-size="14.5">01 · Retrieve source support</text>
  <text x="476" y="439" fill="#F3EEFF" font-size="14.5">02 · Verify quotes against chunks</text>
  <text x="476" y="468" fill="#F3EEFF" font-size="14.5">03 · Score coverage and quality</text>
  <rect x="476" y="486" width="248" height="24" rx="9" fill="#FFFFFF" fill-opacity=".14"/>
  <text x="600" y="503" text-anchor="middle" fill="#FFFFFF" font-size="11.8" font-weight="750">TRACEABILITY PRESERVED END TO END</text>

  <path class="flow" d="M762 430H818" fill="none" stroke="#9A7BF2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Output card -->
  <rect x="834" y="360" width="296" height="148" rx="22" fill="#3F236F" opacity=".07"/>
  <rect x="834" y="356" width="296" height="148" rx="22" fill="#21192E" stroke="#514268" stroke-width="1.5"/>
  <circle cx="868" cy="390" r="18" fill="#302243"/>
  <path d="M859 383h18M859 390h18M859 397h12" fill="none" stroke="#D8C9FF" stroke-width="2" stroke-linecap="round"/>
  <text x="898" y="386" fill="#F5F1FF" font-size="19" font-weight="750">Review-ready artifacts</text>
  <text x="898" y="410" fill="#B9AFC8" font-size="14.5">Requirements · stories · criteria</text>
  <text x="858" y="444" fill="#B9AFC8" font-size="14.5">Summaries · evidence · quality findings</text>
  <g font-size="12.5" font-weight="700">
    <rect x="858" y="463" width="82" height="25" rx="9" fill="#302243"/><text x="899" y="480" text-anchor="middle" fill="#D8C9FF">User stories</text>
    <rect x="948" y="463" width="76" height="25" rx="9" fill="#183A32"/><text x="986" y="480" text-anchor="middle" fill="#9DE7D2">Evidence</text>
    <rect x="1032" y="463" width="72" height="25" rx="9" fill="#1E2E43"/><text x="1068" y="480" text-anchor="middle" fill="#AFCDEF">Exports</text>
  </g>
</g>
</svg>