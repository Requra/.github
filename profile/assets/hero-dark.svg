<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Requra.AI evidence-grounded requirements engineering</title>
<desc id="desc">A visual flow from documents, meetings, transcripts, and audio through evidence-grounded intelligence into requirements, stories, acceptance criteria, and delivery exports (dark theme).</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F0A14"/><stop offset="1" stop-color="#1A1020"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A898F0"/></marker>
</defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="504" rx="22" fill="#21192E" stroke="#3D2E52" stroke-width="2"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <g transform="translate(70 60)"><rect width="62" height="62" rx="18" fill="url(#brand)"/><path d="M17 18h23c10 0 16 5 16 13 0 6-3 10-9 12l10 14H43L34 45h-5v12H17V18zm12 10v9h10c3 0 5-2 5-5s-2-4-5-4H29z" fill="#FFF"/><circle cx="49" cy="14" r="5" fill="#BDF5E2"/></g>
  <text x="150" y="105" fill="#F5F1FF" font-size="46" font-weight="800">Requra.AI</text>
  <text x="70" y="165" fill="#C4A0FF" font-size="18" font-weight="750" letter-spacing="2.5">EVIDENCE-GROUNDED REQUIREMENTS</text>
  <text x="70" y="190" fill="#C4A0FF" font-size="18" font-weight="750" letter-spacing="2.5">ENGINEERING</text>
  <text x="70" y="252" fill="#F5F1FF" font-size="38" font-weight="800">From scattered project context</text>
  <text x="70" y="300" fill="#F5F1FF" font-size="38" font-weight="800">to review-ready delivery artifacts.</text>
  <text x="70" y="350" fill="#B8A8D0" font-size="17">Capture context. Retrieve evidence. Verify quotes. Align stakeholders.</text>
  <g transform="translate(70 380)"><rect width="184" height="96" rx="18" fill="#2E2540" stroke="#4D3F62" stroke-width="2"/><path d="M22 22h28l11 11v35H22zM50 22v13h11" fill="none" stroke="#A898F0" stroke-width="2.6" stroke-linejoin="round"/><text x="76" y="40" fill="#E9E2FF" font-size="16" font-weight="700">Documents</text><text x="76" y="63" fill="#9D92B8" font-size="14">PDF · DOCX · text</text></g>
  <g transform="translate(272 380)"><rect width="184" height="96" rx="18" fill="#2E2540" stroke="#4D3F62" stroke-width="2"/><path d="M29 48a11 11 0 0 0 22 0V34a11 11 0 0 0-22 0zm11 11v11m-15 0h30" fill="none" stroke="#A898F0" stroke-width="2.6" stroke-linecap="round"/><text x="76" y="40" fill="#E9E2FF" font-size="16" font-weight="700">Meetings</text><text x="76" y="63" fill="#9D92B8" font-size="14">audio · transcript</text></g>
  <path d="M474 428H535" stroke="#A898F0" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(548 355)"><rect width="186" height="155" rx="28" fill="url(#brand)"/><circle cx="93" cy="50" r="22" fill="#FFF" fill-opacity=".12" stroke="#D4C5FF" stroke-width="2"/><circle cx="83" cy="45" r="4" fill="#FFF"/><circle cx="103" cy="45" r="4" fill="#FFF"/><path d="M81 60h24M93 28v-9M73 32l-8-8M113 32l8-8" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/><text x="93" y="105" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800">Grounded</text><text x="93" y="130" text-anchor="middle" fill="#FFF" font-size="18" font-weight="800">intelligence</text><text x="93" y="155" text-anchor="middle" fill="#E4D9FF" font-size="13">retrieve · verify · score</text></g>
  <path d="M749 428H808" stroke="#A898F0" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(824 355)"><rect width="306" height="155" rx="24" fill="#2E2540" stroke="#4D3F62" stroke-width="2"/><g transform="translate(20 26)"><rect width="126" height="45" rx="12" fill="#3D2F52"/><text x="63" y="29" text-anchor="middle" fill="#C4A0FF" font-size="15" font-weight="700">Requirements</text><rect x="140" width="126" height="45" rx="12" fill="#2D4C42"/><text x="203" y="29" text-anchor="middle" fill="#7DD3C0" font-size="15" font-weight="700">Evidence</text><rect y="61" width="126" height="45" rx="12" fill="#3D2F52"/><text x="63" y="90" text-anchor="middle" fill="#C4A0FF" font-size="15" font-weight="700">User stories</text><rect x="140" y="61" width="126" height="45" rx="12" fill="#2D3D52"/><text x="203" y="90" text-anchor="middle" fill="#7CB9D8" font-size="15" font-weight="700">Exports</text></g></g>
</g></svg>
