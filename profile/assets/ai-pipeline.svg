<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Requra.AI thirteen-node AI pipeline</title>
<desc id="desc">A responsive multi-row diagram of the thirteen-node LangGraph workflow: unified source preparation for documents, transcripts, and audio; a rejected-or-empty short circuit straight to formatting; evidence retrieval and grounding; and a bounded quality repair loop.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6D3ED1"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C67B20"/></marker></defs>
<rect width="1200" height="900" rx="28" fill="#FBFAFE"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="48" y="55" fill="#25183C" font-size="28" font-weight="800">13-node evidence-grounded AI workflow</text>
<text x="48" y="84" fill="#6F647C" font-size="16">The only cycle is a configuration-controlled, bounded story-repair pass.</text>
<rect x="38" y="112" width="1124" height="136" rx="22" fill="#F1EDFB" stroke="#D7CCF1"/><text x="58" y="139" fill="#6340B3" font-size="14" font-weight="800">INPUT SAFETY &amp; SOURCE PREPARATION</text>
<rect x="38" y="270" width="1124" height="136" rx="22" fill="#F7F4FC" stroke="#DDD5E9"/><text x="58" y="297" fill="#694F7F" font-size="14" font-weight="800">REQUIREMENT INTELLIGENCE</text>
<rect x="38" y="428" width="1124" height="136" rx="22" fill="#EEF4FA" stroke="#CBD9E7"/><text x="58" y="455" fill="#3F668D" font-size="14" font-weight="800">EVIDENCE, CLASSIFICATION &amp; GENERATION</text>
<rect x="38" y="586" width="1124" height="176" rx="22" fill="#FFF8E8" stroke="#E4C88E"/><text x="58" y="613" fill="#7D5B1C" font-size="14" font-weight="800">QUALITY CONTROL &amp; DELIVERY</text>
<g fill="#FFF" stroke="#9F8BD8" stroke-width="2"><rect x="65" y="152" width="210" height="76" rx="15"/><rect x="345" y="152" width="320" height="76" rx="15"/><rect x="725" y="152" width="260" height="76" rx="15"/><rect x="65" y="316" width="180" height="62" rx="15"/><rect x="285" y="316" width="190" height="62" rx="15"/><rect x="515" y="316" width="190" height="62" rx="15"/><rect x="65" y="474" width="180" height="62" rx="15"/><rect x="285" y="474" width="190" height="62" rx="15"/><rect x="515" y="474" width="180" height="62" rx="15"/><rect x="65" y="635" width="180" height="62" rx="15"/><rect x="300" y="635" width="180" height="62" rx="15" fill="#FFF3D9" stroke="#C88B31"/><rect x="535" y="635" width="180" height="62" rx="15"/><rect x="770" y="635" width="180" height="62" rx="15"/></g>
<g fill="#352747" font-size="15" font-weight="750" text-anchor="middle"><text x="170" y="196">1 · detect_file_type</text><text x="505" y="188">2 · prepare_sources</text></g>
<text x="505" y="210" text-anchor="middle" fill="#6A6076" font-size="12.5">documents · transcripts · audio (STT) — bounded parallel, PII masking</text>
<g fill="#352747" font-size="15" font-weight="750" text-anchor="middle"><text x="855" y="196">3 · build_source_index</text></g>
<g fill="#352747" font-size="15" font-weight="750" text-anchor="middle"><text x="155" y="354">4 · extract</text><text x="380" y="354">5 · dedupe_requirements</text><text x="610" y="354">6 · retrieve_evidence</text></g>
<g fill="#352747" font-size="15" font-weight="750" text-anchor="middle"><text x="155" y="512">7 · classify</text><text x="380" y="512">8 · evidence_grounding</text><text x="605" y="512">9 · generate</text></g>
<g fill="#352747" font-size="15" font-weight="750" text-anchor="middle"><text x="155" y="673">10 · quality_gate</text><text x="390" y="673">11 · repair_stories</text><text x="625" y="673">12 · summarize</text><text x="860" y="673">13 · format</text></g>
<path d="M275 190H335" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M665 190H715" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M855 228V311H155V316" fill="none" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="262" text-anchor="middle" fill="#725A82" font-size="14">usable chunks</text>
<path d="M505 228C505 258 900 258 900 635" fill="none" stroke="#8A92A3" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="760" y="248" fill="#717986" font-size="14">rejected · error · no chunks → format</text>
<path d="M245 347H275" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M475 347H505" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M610 378V463H155V464" fill="none" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M245 505H275" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M475 505H505" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M605 536V621H155V625" fill="none" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M245 666H290" stroke="#C67B20" stroke-width="2.5" marker-end="url(#r)"/><text x="268" y="652" text-anchor="middle" fill="#7D5B1C" font-size="14">repairable</text><path d="M390 697V734C390 748 155 748 155 707" fill="none" stroke="#C67B20" stroke-width="2.5" marker-end="url(#r)"/><text x="274" y="750" text-anchor="middle" fill="#7D5B1C" font-size="14">bounded loop: max attempts + eligible issues</text><path d="M245 682C300 730 490 730 535 682" fill="none" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="390" y="719" text-anchor="middle" fill="#725A82" font-size="14">pass / repair disabled / exhausted</text><path d="M715 666H760" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><path d="M950 666H1120" stroke="#6D3ED1" stroke-width="2.5" marker-end="url(#a)"/><text x="1035" y="654" text-anchor="middle" fill="#725A82" font-size="14">public V1 result + exports</text>
<g transform="translate(65 790)"><rect width="330" height="70" rx="17" fill="#FFFFFF" stroke="#A994DF"/><text x="18" y="28" fill="#44316B" font-size="15" font-weight="800">Retrieval</text><text x="18" y="51" fill="#6A6076" font-size="14">BM25 primary · optional hybrid vectors</text><rect x="365" width="330" height="70" rx="17" fill="#FFFFFF" stroke="#A994DF"/><text x="383" y="28" fill="#44316B" font-size="15" font-weight="800">Grounding</text><text x="383" y="51" fill="#6A6076" font-size="14">verifies final evidence quotes in source chunks</text><rect x="730" width="330" height="70" rx="17" fill="#FFFFFF" stroke="#A994DF"/><text x="748" y="28" fill="#44316B" font-size="15" font-weight="800">Providers</text><text x="748" y="51" fill="#6A6076" font-size="14">chat · STT · embeddings configured per environment</text></g>
</g></svg>
