<rect width="1200" height="820" rx="28" fill="#FBFAFE"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="52" y="58" fill="#25183C" font-size="28" font-weight="800">End-to-end platform architecture</text>
<text x="52" y="87" fill="#6F647C" font-size="16">Solid paths are verified normal flows. Dashed paths are conditional, external, or planned.</text>
