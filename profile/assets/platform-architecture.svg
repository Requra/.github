<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Requra.AI end-to-end platform architecture</title>
<desc id="desc">Business users access the React web application, which calls an external .NET backend. The backend owns authentication, projects, files, and meetings, and submits durable asynchronous jobs to a FastAPI AI service backed by PostgreSQL, Redis RQ, workers, configurable providers, and pgvector artifacts.</desc>
